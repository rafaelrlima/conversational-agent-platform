<div class="container">

  <h1>
    Conversational Agent Platform
  </h1>

  <div class="chat-window" #chatWindow>

    @for(message of messages; track $index) {

      <div
        class="message"
        [class.user]="message.role === 'user'"
        [class.assistant]="message.role === 'assistant'">

        <strong>

          {{
            message.role === 'user'
              ? 'You'
              : 'Assistant'
          }}

        </strong>

        <p>{{ message.content }}</p>

      </div>

    }

    @if (loading) {

      <div class="thinking">
        🤖 Thinking...
      </div>

    }

  </div>

  <textarea
    [(ngModel)]="message"
    (keydown.enter)="send(); $event.preventDefault()"
    rows="4"
    placeholder="Type your message">
  </textarea>

  <button (click)="send()">
    Send
  </button>

</div>
