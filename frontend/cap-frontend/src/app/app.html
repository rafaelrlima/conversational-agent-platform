<div class="container">

  <h1>Conversational Agent Platform</h1>

  <textarea
    [(ngModel)]="message"
    (keydown.enter)="send(); $event.preventDefault()"
    rows="5"
    placeholder="Type your message here">
  </textarea>

  <br>

  <button (click)="send()">
    Send
  </button>

  <div *ngIf="loading" class="loading">
    🤖 Thinking...
  </div>

  <h3>Response</h3>

  <div class="response">
    {{ response }}
  </div>

</div>
